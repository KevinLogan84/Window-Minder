name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: xcodebuild test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run tests
        run: xcodebuild test -scheme WindowMinder -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
