name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: xcodebuild test
    # macos-26 is the current macos-latest image. Its newest stable Xcode is 26.6
    # (macosx26.5). macos-15 stops at Xcode 26.3, whose actool closes the
    # AssetCatalogAgent connection while compiling AppIcon.icon.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: xcodebuild test -scheme WindowMinder -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
